[package]
name = "rotalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Safe, fast log rotation for Apache-style pipes, written in Rust"
license = "MIT"
authors = ["playok"]
readme = "README.en.md"
repository = "https://github.com/playok/rotalog"
homepage = "https://github.com/playok/rotalog"
documentation = "https://docs.rs/rotalog"
keywords = ["logging", "rotation", "apache", "httpd", "rotatelogs"]
categories = ["command-line-utilities"]

[[bin]]
name = "rotalog"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
signal-hook = "0.4"

[dev-dependencies]
chrono-tz = "0.10"
criterion = "0.5"
tempfile = "3.27"

[[bench]]
name = "writer"
harness = false

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
